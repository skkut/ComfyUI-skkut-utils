name: Validate classified styles

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/import_classified_styles.py"
      - "scripts/classified_styles_v18_renames.json"
      - "scripts/classified_styles_v18_curated.json"
      - "skutils_style_selector/styles.json"
      - ".github/workflows/validate-classified-styles.yml"
  pull_request:
    paths:
      - "scripts/import_classified_styles.py"
      - "scripts/classified_styles_v18_renames.json"
      - "scripts/classified_styles_v18_curated.json"
      - "skutils_style_selector/styles.json"
      - ".github/workflows/validate-classified-styles.yml"
  schedule:
    # Weekly drift check against the published sheet.
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  validate:
    name: Import and compare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check curated styles against the live sheet
        run: python scripts/import_classified_styles.py --check
