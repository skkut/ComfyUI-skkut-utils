[project]
name = "skkut-utils"
description = "A collection of small utilities for ComfyUI: Auto Dark Mode, Detailed Job Status timer, Save Compressed Weppy (WebP with embedded prompt/workflow metadata), Skutils Resolution Calculator, Skutils Scale Image to Total Pixels (the built-in resize node with an optional image input), Skutils Text Preview (text persisted in the saved workflow JSON), and Skutils Style Selector (a bundled 434-style visual picker with positive/negative prompt output, combine/batch modes, and custom styles)."
version = "0.4.0"
license = { file = "LICENSE" }
dependencies = ["piexif"]

[project.urls]
Repository = "https://github.com/skkut/ComfyUI-skkut-utils"

[tool.comfy]
PublisherId = "skkut"
DisplayName = "Skkut Utils"
